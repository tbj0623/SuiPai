# XcodeGen 工程定义：随拍 iOS 壳
# 生成：cd ios && xcodegen generate
#
# SuiPaiKit（KMP 动态框架）的接入方式见 BUILD.md。
# 这里刻意「不」把 framework 写进 dependencies：仓库里还没有构建产物，
# 硬引用会让 xcodegen 在首次生成工程时直接报文件缺失。
# 实际链接靠 preBuildScript 调 Gradle 的 embedAndSignAppleFrameworkForXcode，
# 再由 FRAMEWORK_SEARCH_PATHS + OTHER_LDFLAGS 完成链接。
name: SuiPaiIOS

options:
  bundleIdPrefix: com.suipai
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    # Gradle 构建脚本要写 shared/build 与 derived 目录，必须关掉脚本沙箱
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  SuiPaiIOS:
    type: application
    platform: iOS
    sources:
      - path: SuiPaiIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suipai.ios
        # 可执行文件名保持 ASCII；桌面显示名走 CFBundleDisplayName
        PRODUCT_NAME: SuiPaiIOS
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES

        # Info.plist 片段（GENERATE_INFOPLIST_FILE 会把这些合进生成的 plist）
        INFOPLIST_KEY_CFBundleDisplayName: 随拍
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 随拍需要访问相册，用来浏览照片、在「一瞬」里调色并保存成片。
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 随拍需要把调色后的成片和拍摄的照片保存到你的相册。
        INFOPLIST_KEY_NSCameraUsageDescription: 随拍需要使用相机来拍照。
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 用于在局域网内发现并直传照片给附近设备
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent

        # ---- SuiPaiKit 接入 ----
        # embedAndSignAppleFrameworkForXcode 会把框架产出放到
        #   shared/build/xcode-frameworks/$CONFIGURATION/$SDK_NAME
        # 手工 assemble 的产物则在
        #   shared/build/bin/<target>/<buildType>
        # 三条都列上，先命中哪条用哪条（Xcode 只关心能不能找到）。
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
          - "$(SRCROOT)/../shared/build/bin/iphoneos/Debug-iphoneos"
          - "$(SRCROOT)/../shared/build/bin/iphonesimulator/Debug-iphonesimulator"
          # 手工 assemble 的真实产出目录（KMP 约定：小写 debugFramework）
          - "$(SRCROOT)/../shared/build/bin/iosArm64/debugFramework"
          - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "SuiPaiKit"

    preBuildScripts:
      - name: "Embed SuiPaiKit (KMP)"
        basedOnDependencyAnalysis: false
        script: |
          # Xcode 提供 CONFIGURATION / SDK_NAME / ARCHS / TARGET_BUILD_DIR /
          # FRAMEWORKS_FOLDER_PATH，KMP 的 embedAndSign 任务正是靠这些变量决定
          # 编译哪个 target、拷到哪儿、用什么身份签名。
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode